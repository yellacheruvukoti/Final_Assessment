<app-page-header [pageTitle]="'Learning – ' + (courseTitle || '…')"></app-page-header>

<app-skeleton-loader *ngIf="isLoading" type="table"></app-skeleton-loader>

<div *ngIf="accessDeniedMessage" class="course-materials__denied">
  <p>{{ accessDeniedMessage }}</p>
</div>

<div *ngIf="errorMessage" class="course-materials__error">
  <p>{{ errorMessage }}</p>
  <button type="button" (click)="retry()">Retry</button>
</div>

<ng-container *ngIf="!isLoading && !accessDeniedMessage && !errorMessage">
  <app-empty-state
    *ngIf="flatLessons.length === 0"
    message="No lessons available for this course."
  ></app-empty-state>

  <div *ngIf="flatLessons.length > 0" class="course-materials__progress">
    Course progress: {{ courseProgressPercentage }}%
  </div>

  <div *ngIf="flatLessons.length > 0" class="course-materials__layout">
    <nav class="course-materials__nav" aria-label="Course modules and lessons">
      <div *ngFor="let group of moduleGroups" class="course-materials__nav-module">
        <button
          type="button"
          class="course-materials__nav-module-toggle"
          (click)="toggleModule(group.module.moduleId)"
          [attr.aria-expanded]="isModuleExpanded(group.module.moduleId)"
        >
          {{ group.module.title }}
        </button>
        <ul *ngIf="isModuleExpanded(group.module.moduleId)" class="course-materials__nav-lesson-list">
          <li *ngFor="let material of group.materials">
            <button
              type="button"
              class="course-materials__nav-lesson"
              [class.course-materials__nav-lesson--active]="material.materialId === selectedMaterialId"
              (click)="selectLesson(material)"
            >
              {{ material.title }}
            </button>
          </li>
        </ul>
      </div>
    </nav>

    <main class="course-materials__content" *ngIf="selectedMaterial as material">
      <p class="course-materials__module-label">{{ selectedModuleTitle }}</p>
      <h2 class="course-materials__lesson-title">{{ material.title }}</h2>
      <p class="course-materials__lesson-meta">
        <span class="course-materials__badge">{{ material.materialType }}</span>
        <span class="course-materials__badge">{{ material.accessLevel }}</span>
      </p>
      <a class="course-materials__lesson-resource" [href]="material.resourcePath" target="_blank" rel="noopener">
        Open lesson content
      </a>

      <div class="course-materials__lesson-actions">
        <button type="button" [disabled]="isMarkingComplete" (click)="markComplete()">
          {{ isMarkingComplete ? 'Saving…' : 'Mark as Complete' }}
        </button>
        <div class="course-materials__nav-buttons">
          <button type="button" [disabled]="!hasPrevious" (click)="previousLesson()">Previous Lesson</button>
          <button type="button" [disabled]="!hasNext" (click)="nextLesson()">Next Lesson</button>
        </div>
      </div>
    </main>
  </div>
</ng-container>
