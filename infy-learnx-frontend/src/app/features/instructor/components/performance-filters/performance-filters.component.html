<div class="performance-filters">
  <label class="performance-filters__field">
    Course
    <select [value]="selectedCourseId" (change)="courseChange.emit($any($event.target).value)">
      <option value="">All courses</option>
      <option *ngFor="let course of courseOptions" [value]="course.courseId">{{ course.title }}</option>
    </select>
  </label>
</div>
