<app-page-header pageTitle="Certificate Management"></app-page-header>

<div class="certificate-management__toolbar">
  <label class="certificate-management__filter">
    Status
    <select [value]="status" (change)="onStatusChange($any($event.target).value)">
      <option value="">All</option>
      <option *ngFor="let option of statusOptions" [value]="option">{{ option }}</option>
    </select>
  </label>
</div>

<div *ngIf="errorMessage" class="certificate-management__error">
  <p>{{ errorMessage }}</p>
  <button type="button" (click)="retry()">Retry</button>
</div>

<app-data-table
  *ngIf="!errorMessage"
  [columns]="columns"
  [rows]="visibleRows"
  [isLoading]="isLoading"
  emptyMessage="No certificates found."
  [currentSort]="currentSort"
  [totalElements]="totalElements"
  [totalPages]="totalPages"
  [currentPage]="currentPage"
  [pageSize]="pageSize"
  (sortChange)="onSortChange($event)"
  (pageChange)="onPageChange($event)"
  (pageSizeChange)="onPageSizeChange($event)"
>
  <ng-template let-row>
    <button
      *ngIf="row.status === CertificateStatus.ISSUED"
      type="button"
      [disabled]="row.isRevoking"
      (click)="onRevoke(row)"
    >
      {{ row.isRevoking ? 'Revoking…' : 'Revoke' }}
    </button>
  </ng-template>
</app-data-table>
