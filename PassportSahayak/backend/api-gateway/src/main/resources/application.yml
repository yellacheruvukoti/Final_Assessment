server:
  port: ${SERVER_PORT:9080}

spring:
  application:
    name: api-gateway
  servlet:
    multipart:
      # The gateway must never parse multipart bodies itself (e.g. KB document uploads) -
      # it just forwards raw bytes downstream. Disabling this keeps DispatcherServlet from
      # consuming the multipart stream before the proxy controller can read it.
      enabled: false

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  routes:
    - prefix: /api/auth
      target: ${AUTH_SERVICE_URL:http://localhost:9081}
    - prefix: /api/applications
      target: ${APPLICATION_SERVICE_URL:http://localhost:9082}
    - prefix: /api/appointments
      target: ${APPOINTMENT_SERVICE_URL:http://localhost:9083}
    - prefix: /api/centers
      target: ${APPOINTMENT_SERVICE_URL:http://localhost:9083}
    - prefix: /api/pv
      target: ${PV_SERVICE_URL:http://localhost:9084}
    - prefix: /api/grievances
      target: ${GRIEVANCE_SERVICE_URL:http://localhost:9085}
    - prefix: /api/appeals
      target: ${GRIEVANCE_SERVICE_URL:http://localhost:9085}
    - prefix: /api/fraud
      target: ${FRAUD_SERVICE_URL:http://localhost:9086}
    - prefix: /api/kb
      target: ${KB_SERVICE_URL:http://localhost:9087}
    - prefix: /api/ai
      target: ${KB_SERVICE_URL:http://localhost:9087}

logging:
  level:
    com.passportsahayak.gateway: INFO
